<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e0f">
<title>Praneet — Command Centre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e0e0f;--s1:#161618;--s2:#1c1c1f;--s3:#242428;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0efe8;--muted:#7a7977;--dim:#4a4a48;--accent:#c8b89a;--accent2:#8b7355;--red:#e05a4e;--amber:#d4902a;--green:#5a9e6f;--blue:#4a85c8;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--mono:ui-monospace,monospace}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overscroll-behavior:none}
#configScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;text-align:center;background:var(--bg)}
#configScreen h1{font-size:22px;font-weight:500;color:var(--text);margin-bottom:8px}
#configScreen p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
#configScreen input{width:100%;background:var(--s1);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;margin-bottom:12px}
#configScreen button{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:10px;padding:14px;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer}
.config-note{font-size:11px;color:var(--dim);margin-top:16px;line-height:1.6}
#app{display:none;max-width:480px;margin:0 auto;padding:0 0 80px}
.header{padding:52px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.label{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
.date-str{font-size:22px;font-weight:500;letter-spacing:-0.02em;margin-top:2px;color:var(--text)}
.time-str{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:2px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.today-wrap{padding:0 16px;margin-bottom:6px}
.today-card{background:var(--s1);border:1px solid var(--border2);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.today-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent)}
.today-label{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px}
.today-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.today-main{font-size:16px;font-weight:500;color:var(--text)}
.today-sub{font-size:12px;color:var(--muted);margin-top:4px}
.today-badge{font-size:10px;font-family:var(--mono);padding:5px 12px;border-radius:20px;border:1px solid;white-space:nowrap;flex-shrink:0}
.badge-shoot{color:var(--accent);border-color:var(--accent2);background:rgba(200,184,154,0.08)}
.badge-desk{color:var(--muted);border-color:var(--border2)}
.section{padding:14px 16px 0}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-title{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
.section-count{font-size:10px;font-family:var(--mono);color:var(--muted);background:var(--s2);padding:2px 9px;border-radius:10px;border:1px solid var(--border)}
.card{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot-red{background:var(--red)}.dot-amber{background:var(--amber)}.dot-green{background:var(--green)}.dot-blue{background:var(--blue)}.dot-muted{background:var(--dim)}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.35}
.card-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px;border:1px solid}
.tag-urgent{color:var(--red);border-color:rgba(224,90,78,0.3);background:rgba(224,90,78,0.06)}
.tag-waiting{color:var(--amber);border-color:rgba(212,144,42,0.3);background:rgba(212,144,42,0.06)}
.tag-info{color:var(--blue);border-color:rgba(74,133,200,0.3);background:rgba(74,133,200,0.06)}
.tag-daily{color:var(--red);border-color:rgba(224,90,78,0.3);background:rgba(224,90,78,0.06)}
.tag-short{color:var(--amber);border-color:rgba(212,144,42,0.3);background:rgba(212,144,42,0.06)}
.card-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.card-age{font-size:10px;font-family:var(--mono);color:var(--dim)}
.pipeline-row{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:12px 15px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.pipeline-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.pipeline-stage{font-size:10px;font-family:var(--mono);color:var(--muted);flex-shrink:0}
.pipeline-action{font-size:11px;color:var(--accent);text-align:right;min-width:80px;line-height:1.3;flex-shrink:0}
.rv-card{background:var(--s1);border:1px solid var(--border2);border-radius:12px;overflow:hidden}
.rv-item{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;border-bottom:1px solid var(--border)}
.rv-item:last-child{border-bottom:none}
.rv-num{font-size:11px;font-family:var(--mono);color:var(--dim);width:16px;flex-shrink:0;margin-top:2px}
.rv-text{font-size:13px;color:var(--text);line-height:1.35}
.rv-tier{font-size:10px;font-family:var(--mono);color:var(--dim);margin-top:3px}
.refresh-wrap{padding:12px 16px 0;display:flex;justify-content:center}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 20px;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer}
.loading{text-align:center;padding:40px 20px;color:var(--muted);font-size:12px;font-family:var(--mono)}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 3px;animation:blink 1.2s infinite}
.loading-dot:nth-child(2){animation-delay:0.2s}.loading-dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}
.error-card{background:rgba(224,90,78,0.07);border:1px solid rgba(224,90,78,0.2);border-radius:10px;padding:12px 15px;margin:6px 0;font-size:12px;color:var(--red)}
.empty{text-align:center;padding:20px;color:var(--dim);font-size:12px;font-family:var(--mono)}
.gear-btn{position:fixed;bottom:24px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;z-index:100}
</style>
</head>
<body>

<div id="configScreen">
  <h1>Command Centre</h1>
  <p>Paste your Notion integration token to connect your workspace.</p>
  <input type="text" id="tokenInput" placeholder="ntn_..." autocomplete="off" spellcheck="false">
  <button onclick="saveToken()">Connect Workspace</button>
  <p class="config-note">Stored only on your device.</p>
</div>

<div id="app">
  <div class="header">
    <div>
      <div class="label">Command Centre</div>
      <div class="date-str" id="dateStr">—</div>
      <div class="time-str" id="timeStr">—</div>
    </div>
    <div class="live-dot"></div>
  </div>
  <div class="today-wrap">
    <div class="today-card">
      <div class="today-label">Today</div>
      <div class="today-row">
        <div>
          <div class="today-main" id="todayMain">Loading...</div>
          <div class="today-sub" id="todaySub"></div>
        </div>
        <div class="today-badge badge-desk" id="todayBadge">—</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">My Tasks</span><span class="section-count" id="taskCount">—</span></div>
    <div id="taskList"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Waiting on Others</span><span class="section-count" id="waitCount">—</span></div>
    <div id="waitList"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Approvals</span><span class="section-count" id="approvalCount">—</span></div>
    <div id="approvalList"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Active Guest Pipeline</span><span class="section-count" id="pipelineCount">—</span></div>
    <div id="pipelineList"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Ranveer's Short-Term List</span><span class="section-count" id="rvCount">—</span></div>
    <div id="rvList"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
  </div>
  <div class="refresh-wrap"><button class="refresh-btn" onclick="loadAll()">↻ refresh</button></div>
  <div style="height:20px"></div>
</div>

<div class="gear-btn" id="gearBtn" style="display:none" onclick="resetToken()">⚙</div>

<script>
const GAS = 'https://shrill-thunder-13cc.praneetnath-tiwari.workers.dev/';
const DB = {
  tasks:'32d6a450-c478-8002-b87d-000bb55cc194',
  guests:'8c799a6e-c4ec-43b5-a4f8-30d6bbd7f0af',
  shoots:'88c0fb7a-489f-4907-b4f6-e464d3bfb6a7'
};
const ACTIVE_STAGES=['Intent Confirmed','Outreach','Date Locked','Pre-Shoot Prep','Shoot Done','Editing — In Progress','Editing — Done','Approval — Sent','Approval — Awaiting Reply','Approval — Changes Requested'];
const APPROVAL_STAGES=['Approval — Sent','Approval — Awaiting Reply','Approval — Changes Requested'];
let TOKEN='';

function prop(page,name){const p=page.properties&&page.properties[name];if(!p)return null;if(p.type==='title')return p.title?.map(t=>t.plain_text).join('')||'';if(p.type==='rich_text')return p.rich_text?.map(t=>t.plain_text).join('')||'';if(p.type==='select')return p.select?.name||'';if(p.type==='date')return p.date?.start||'';return null;}
function pageTitle(page){for(const key of Object.keys(page.properties||{})){const p=page.properties[key];if(p.type==='title')return p.title?.map(t=>t.plain_text).join('')||'Untitled';}return'Untitled';}
function daysAgo(d){if(!d)return'';const diff=Math.floor((new Date()-new Date(d))/86400000);if(diff===0)return'today';if(diff===1)return'1d ago';return diff+'d ago';}

async function query(dbId,body){
  const res=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOKEN,dbId:dbId,body:body})});
  if(!res.ok)throw new Error('Error '+res.status);
  return res.json();
}

function tick(){const now=new Date();const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];document.getElementById('dateStr').textContent=days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()];const h=now.getHours(),m=now.getMinutes();const ampm=h>=12?'PM':'AM';document.getElementById('timeStr').textContent=(h%12||12)+':'+(m<10?'0':'')+m+' '+ampm+' IST';}
function empty(id){document.getElementById(id).innerHTML='<div class="empty">Nothing here</div>';}
function err(id,msg){document.getElementById(id).innerHTML='<div class="error-card">'+msg+'</div>';}

async function loadToday(){
  try{
    const today=new Date().toISOString().split('T')[0];
    const data=await query(DB.shoots,{filter:{and:[{property:'Date',date:{on_or_after:today}},{property:'Date',date:{on_or_before:today}}]},page_size:3});
    if(data.results&&data.results.length>0){
      const s=data.results[0];
      const guest=prop(s,'Guest')||pageTitle(s);
      const studio=prop(s,'Studio')||'';
      const roll=prop(s,'Roll Time')||'';
      document.getElementById('todayMain').textContent=guest;
      document.getElementById('todaySub').textContent=[studio,roll?'Roll: '+roll:''].filter(Boolean).join(' · ');
      document.getElementById('todayBadge').textContent='Shoot Day';
      document.getElementById('todayBadge').className='today-badge badge-shoot';
    } else {
      document.getElementById('todayMain').textContent='No shoot scheduled';
      document.getElementById('todaySub').textContent='Desk day — follow-ups + outreach';
      document.getElementById('todayBadge').textContent='Desk';
    }
  }catch(e){document.getElementById('todayMain').textContent='No shoot today';document.getElementById('todayBadge').textContent='Desk';}
}

async function loadTasks(){
  try{
    const data=await query(DB.tasks,{filter:{and:[{or:[{property:'Status',select:{equals:'To Do'}},{property:'Status',select:{equals:'In progress'}}]},{or:[{property:'Tier',select:{equals:'Daily'}},{property:'Tier',select:{equals:'Short'}}]}]}},sorts:[{property:'Tier',direction:'ascending'}],page_size:20});
    const pages=data.results||[];
    document.getElementById('taskCount').textContent=pages.length;
    if(!pages.length){empty('taskList');return;}
    document.getElementById('taskList').innerHTML=pages.slice(0,10).map(p=>{
      const t=pageTitle(p);const tier=prop(p,'Tier')||'';const by=prop(p,'Assigned By')||'';const due=prop(p,'Due')||'';
      return'<div class="card"><div class="dot '+(tier==='Daily'?'dot-red':'dot-amber')+'"></div><div class="card-body"><div class="card-title">'+t+'</div><div class="card-meta"><span class="tag '+(tier==='Daily'?'tag-daily':'tag-short')+'">'+tier+'</span>'+(by?'<span>'+by+'</span>':'')+'</div></div>'+(due?'<div class="card-right"><div class="card-age">'+daysAgo(due)+'</div></div>':'')+'</div>';
    }).join('');
  }catch(e){err('taskList','Could not load tasks');}
}

async function loadWaiting(){
  try{
    const data=await query(DB.tasks,{filter:{property:'Status',select:{equals:'Waiting on Ranveer'}},page_size:20});
    const pages=data.results||[];
    document.getElementById('waitCount').textContent=pages.length;
    if(!pages.length){empty('waitList');return;}
    document.getElementById('waitList').innerHTML=pages.slice(0,8).map(p=>{
      const t=pageTitle(p);const by=prop(p,'Assigned By')||'';const age=daysAgo(p.last_edited_time||'');
      return'<div class="card"><div class="dot dot-amber"></div><div class="card-body"><div class="card-title">'+t+'</div><div class="card-meta"><span class="tag tag-waiting">Waiting</span>'+(by?'<span>'+by+'</span>':'')+'</div></div>'+(age?'<div class="card-right"><div class="card-age">'+age+'</div></div>':'')+'</div>';
    }).join('');
  }catch(e){err('waitList','Could not load');}
}

async function loadApprovals(){
  try{
    const data=await query(DB.guests,{filter:{or:APPROVAL_STAGES.map(s=>({property:'Stage',select:{equals:s}}))},page_size:20});
    const pages=data.results||[];
    document.getElementById('approvalCount').textContent=pages.length;
    if(!pages.length){empty('approvalList');return;}
    document.getElementById('approvalList').innerHTML=pages.slice(0,8).map(p=>{
      const t=pageTitle(p);const stage=prop(p,'Stage')||'';const by=prop(p,'Approval Sent By')||'';
      const urgent=stage==='Approval — Awaiting Reply';const changes=stage==='Approval — Changes Requested';
      return'<div class="card"><div class="dot '+(urgent?'dot-red':changes?'dot-amber':'dot-blue')+'"></div><div class="card-body"><div class="card-title">'+t+'</div><div class="card-meta"><span class="tag '+(urgent?'tag-urgent':changes?'tag-waiting':'tag-info')+'">'+stage.replace('Approval — ','')+'</span>'+(by?'<span>by '+by+'</span>':'')+'</div></div></div>';
    }).join('');
  }catch(e){err('approvalList','Could not load');}
}

async function loadPipeline(){
  try{
    const data=await query(DB.guests,{filter:{or:ACTIVE_STAGES.map(s=>({property:'Stage',select:{equals:s}}))},sorts:[{property:'Shoot Date',direction:'ascending'}],page_size:20});
    const pages=data.results||[];
    document.getElementById('pipelineCount').textContent=pages.length;
    if(!pages.length){empty('pipelineList');return;}
    const actionMap={'Intent Confirmed':'Start outreach','Outreach':'Chase reply','Date Locked':'Pre-shoot prep','Pre-Shoot Prep':'Send logistics','Shoot Done':'Intro/outro?','Editing — In Progress':'Monitor edit','Editing — Done':'Send for approval','Approval — Sent':'Wait 24hr','Approval — Awaiting Reply':'Chase approval','Approval — Changes Requested':'Fix + resend'};
    const dotMap=(s)=>s.includes('Approval')?'dot-amber':s.includes('Editing')?'dot-blue':s==='Shoot Done'?'dot-green':'dot-muted';
    document.getElementById('pipelineList').innerHTML=pages.slice(0,10).map(p=>{
      const t=pageTitle(p);const stage=prop(p,'Stage')||'';
      return'<div class="pipeline-row"><div class="dot '+dotMap(stage)+'"></div><div class="pipeline-name">'+t+'</div><div class="pipeline-stage">'+stage.replace('Editing — ','').replace('Approval — ','')+'</div><div class="pipeline-action">'+(actionMap[stage]||'—')+'</div></div>';
    }).join('');
  }catch(e){err('pipelineList','Could not load');}
}

async function loadRanveer(){
  try{
    const data=await query(DB.tasks,{filter:{and:[{property:'Task For',select:{equals:'Ranveer'}},{property:'Status',select:{does_not_equal:'Done'}},{or:[{property:'Tier',select:{equals:'Daily'}},{property:'Tier',select:{equals:'Short'}}]}]},sorts:[{property:'Tier',direction:'ascending'}],page_size:10});
    const pages=data.results||[];
    document.getElementById('rvCount').textContent=pages.length;
    if(!pages.length){empty('rvList');return;}
    document.getElementById('rvList').innerHTML='<div class="rv-card">'+pages.slice(0,8).map((p,i)=>'<div class="rv-item"><div class="rv-num">'+(i+1)+'</div><div><div class="rv-text">'+pageTitle(p)+'</div><div class="rv-tier">'+(prop(p,'Tier')||'')+'</div></div></div>').join('')+'</div>';
  }catch(e){err('rvList','Could not load');}
}

async function loadAll(){
  ['taskList','waitList','approvalList','pipelineList','rvList'].forEach(id=>{document.getElementById(id).innerHTML='<div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';});
  ['taskCount','waitCount','approvalCount','pipelineCount','rvCount'].forEach(id=>{document.getElementById(id).textContent='—';});
  await Promise.allSettled([loadToday(),loadTasks(),loadWaiting(),loadApprovals(),loadPipeline(),loadRanveer()]);
}

function saveToken(){
  const val=document.getElementById('tokenInput').value.trim();
  if(!val){alert('Please enter your Notion token');return;}
  localStorage.setItem('praneet_notion_token',val);
  TOKEN=val;showApp();
}

function resetToken(){
  if(confirm('Disconnect and re-enter token?')){
    localStorage.removeItem('praneet_notion_token');
    document.getElementById('app').style.display='none';
    document.getElementById('configScreen').style.display='flex';
    document.getElementById('gearBtn').style.display='none';
    TOKEN='';
  }
}

function showApp(){
  document.getElementById('configScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('gearBtn').style.display='flex';
  tick();setInterval(tick,30000);loadAll();
}

(function(){
  const saved=localStorage.getItem('praneet_notion_token');
  if(saved){TOKEN=saved;showApp();}
})();
</script>
</body>
</html>
